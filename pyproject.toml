[project]
name = "pg-mcp"
version = "0.1.0"
description = "Enterprise read-only Postgres MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9",
    "sqlglot>=26",
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6",
    "pydantic>=2.7",
    "python-dotenv>=1",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
gcp = ["google-cloud-secret-manager>=2.20"]

[project.scripts]
pg-mcp = "pg_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "testcontainers[postgres]>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test SQL corpora are more readable as single lines.
"tests/test_gate.py" = ["E501"]
